  <body>
    <div id="root"></div>
    <script>
      // Landing-page embeds render real app screens but remain presentation-only.
      // Normal /app.html behavior is unchanged.
      const params = new URLSearchParams(location.search);
      if (params.get("landing") === "1") {
        let entered = false;
        let navigated = false;
        const target = params.get("screen") || "home";
        const labels = { family: "Family", gather: "Gather", legacy: "Legacy" };

        const enterAndNavigate = () => {
          if (!entered) {
            const signIn = [...document.querySelectorAll("button")].find(
              (node) => node.textContent && node.textContent.trim() === "Sign In"
            );
            if (signIn) {
              entered = true;
              signIn.click();
            }
          }
          if (entered && !navigated && target !== "home") {
            const label = labels[target];
            const navButton = [...document.querySelectorAll("button")].find(
              (node) => node.textContent && node.textContent.trim() === label
            );
            if (navButton) {
              navigated = true;
              navButton.click();
            }
          }
        };

        const observer = new MutationObserver(enterAndNavigate);
        observer.observe(document.documentElement, { subtree: true, childList: true });
        enterAndNavigate();
        setTimeout(() => observer.disconnect(), 15000);
      }
    </script>
