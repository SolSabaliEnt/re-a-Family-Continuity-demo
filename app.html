  <body>
    <div id="root"></div>
    <script>
      // Landing-page embeds should show the real signed-in family experience
      // without introducing a separate mock UI. Normal /app.html behavior is unchanged.
      if (new URLSearchParams(location.search).get("landing") === "1") {
        let entered = false;
        const enter = () => {
          if (entered) return;
          const button = [...document.querySelectorAll("button")].find(
            (node) => node.textContent && node.textContent.trim() === "Sign In"
          );
          if (button) {
            entered = true;
            button.click();
          }
        };
        const observer = new MutationObserver(enter);
        observer.observe(document.documentElement, { subtree: true, childList: true });
        enter();
        setTimeout(() => observer.disconnect(), 12000);
      }
    </script>
